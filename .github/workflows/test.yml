name: test

on:
  push:
    branches: [main]
    paths:
      - "skills/user-guide/**"
      - "tests/user-guide/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "skills/user-guide/**"
      - "tests/user-guide/**"
      - ".github/workflows/test.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  user-guide:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # The version the skill is tested on; keep it in step with the README and SKILL.md.
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18
      - run: quarto run tests/user-guide/run-tests.ts
